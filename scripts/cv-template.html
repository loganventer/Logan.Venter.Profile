<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', Arial, sans-serif; color: #1e293b; font-size: 10pt; line-height: 1.5; padding: 40px 50px; }

  h1 { font-size: 22pt; font-weight: 700; color: #0f172a; margin-bottom: 2px; }
  h2 { font-size: 13pt; font-weight: 700; color: #0284c7; border-bottom: 2px solid #0284c7; padding-bottom: 3px; margin: 18px 0 8px; }
  h3 { font-size: 11pt; font-weight: 600; color: #0f172a; margin-bottom: 2px; }
  h4 { font-size: 10pt; font-weight: 600; color: #334155; }

  .subtitle { font-size: 12pt; color: #0284c7; font-weight: 500; margin-bottom: 6px; }
  .contact { font-size: 9pt; color: #64748b; margin-bottom: 4px; }
  .contact a { color: #0284c7; text-decoration: none; }

  .period { font-size: 9pt; color: #64748b; font-style: italic; }
  .note { font-size: 8.5pt; color: #94a3b8; }

  ul { padding-left: 18px; margin: 4px 0; }
  li { margin: 2px 0; }

  .skills-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 24px; }
  .skill-item { font-size: 9.5pt; }
  .skill-label { font-weight: 600; color: #0f172a; }

  .page-break { page-break-before: always; }

  .tag { display: inline-block; background: #e0f2fe; color: #0369a1; padding: 1px 6px; border-radius: 3px; font-size: 8pt; font-weight: 500; margin: 1px; }
</style>
</head>
<body>
{{CONTENT}}
</body>
</html>
